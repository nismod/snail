name: snail-dev
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  # C++ extension and arrow interactions
  - libarrow-all=21.0.*
  - arrow-c-glib=21.0.*
  - pyarrow=21.0.*
  # Required
  - geopandas
  - openpyxl
  - pyogrio
  - rasterio
  - scipy
  - shapely
  # Python dev
  - black
  - nbstripout
  - pytest
  - pytest-cov
  # Tutorials
  - contextily
  - jupyter
  - matplotlib
  - networkx
  - seaborn
  - pip
  - pip:
      - hilbertcurve
      - irv_autopkg_client
      - pandera>=0.20.0
      - python-igraph
      - snkit
      - tqdm
      - -e .
